<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#fff4d6" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="字芽岛 V2" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="assets/icon-192.png" />
<link rel="icon" type="image/png" href="assets/icon-192.png" />
<title>字芽岛 V2 · 互动趣味汉字</title>
<style>
:root{--ink:#27334f;--muted:#6978a0;--paper:#fffaf0;--line:rgba(43,58,87,.10);--green:#43b985;--green-dark:#278765;--yellow:#ffcc59;--orange:#ff8d55;--blue:#63a9f5;--purple:#a687ef;--pink:#f58caf;--shadow:0 18px 40px rgba(61,74,101,.13);--soft:0 8px 20px rgba(61,74,101,.10);font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent;touch-action:manipulation}
*{box-sizing:border-box}
html,body{width:100%;margin:0;min-height:100%;overflow-x:hidden}
body{background:radial-gradient(circle at 10% 8%,rgba(255,212,101,.40),transparent 23rem),radial-gradient(circle at 92% 18%,rgba(117,207,180,.32),transparent 24rem),radial-gradient(circle at 60% 90%,rgba(255,141,85,.16),transparent 25rem),linear-gradient(180deg,#fff8e7 0%,#f5fbef 60%,#eef8ff 100%);min-height:100dvh;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
button,input,select{font:inherit;color:inherit}
button{border:0;cursor:pointer;background:transparent}
button:focus-visible{outline:4px solid rgba(99,169,245,.35);outline-offset:3px}
.hidden{display:none!important}
#app{min-height:100dvh;position:relative;z-index:1}
.app-shell{width:min(1180px,100%);margin:0 auto;min-height:100dvh;padding:max(14px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(22px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));position:relative;z-index:1}
.decor{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.cloud{position:absolute;width:118px;height:38px;border-radius:40px;background:rgba(255,255,255,.62);filter:blur(.2px);animation:cloudFloat 17s ease-in-out infinite alternate}
.cloud::before,.cloud::after{content:"";position:absolute;border-radius:50%;background:inherit}
.cloud::before{width:52px;height:52px;left:19px;bottom:10px}
.cloud::after{width:66px;height:66px;right:13px;bottom:5px}
.cloud.c1{top:10%;left:-18px;transform:scale(.78)}
.cloud.c2{top:30%;right:-30px;transform:scale(.58);animation-delay:-8s}
.cloud.c3{top:66%;left:8%;transform:scale(.46);animation-delay:-3s}
@keyframes cloudFloat{to{translate:42px 8px}}

.topbar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;min-height:70px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:clamp(22px,3vw,30px);letter-spacing:.02em}
.brand-mark{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(145deg,#6fd09f,#37a978);box-shadow:inset 0 -5px 0 rgba(0,0,0,.08),var(--soft);font-size:31px;transform:rotate(-4deg)}
.brand small{display:block;color:var(--green-dark);font-weight:700;font-size:12px;letter-spacing:.08em;margin-top:-3px}
.top-stats{justify-self:center;display:flex;gap:8px;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.78);padding:8px 14px;border-radius:999px;font-weight:850;box-shadow:var(--soft);display:inline-flex;align-items:center;gap:6px}
.chip b{font-size:18px}
.top-actions{justify-self:end;display:flex;align-items:center;gap:8px}
.icon-btn{min-width:50px;height:50px;padding:0 14px;border-radius:16px;display:inline-grid;place-items:center;background:rgba(255,255,255,.82);box-shadow:var(--soft);font-size:22px;transition:transform .16s ease,box-shadow .16s ease}
.icon-btn:active{transform:translateY(3px) scale(.97);box-shadow:0 4px 10px rgba(61,74,101,.12)}

.paper,.section-card,.library-card,.settings-panel,.report-card,.lesson-card,.world-card,.char-tile,.game-tile,.today-card,.pet-card,.hero-card{background:var(--paper);border:1px solid rgba(255,255,255,.76);box-shadow:var(--shadow);backdrop-filter:blur(13px);-webkit-backdrop-filter:blur(13px)}

.hero{margin-top:14px;display:grid;grid-template-columns:1.35fr .65fr;gap:22px;align-items:stretch}
.hero-card{border-radius:34px;padding:clamp(22px,3.6vw,40px);position:relative;overflow:hidden;display:grid;grid-template-columns:1fr 230px;align-items:center;min-height:265px}
.hero-card::after{content:"";position:absolute;width:300px;height:300px;border-radius:50%;right:-80px;top:-120px;background:radial-gradient(circle at 40% 40%,rgba(255,220,112,.75),rgba(255,220,112,0))}
.hero-copy{position:relative;z-index:2}
.eyebrow{display:inline-flex;align-items:center;gap:6px;color:var(--green-dark);font-weight:800;padding:7px 12px;border-radius:999px;background:#e7f8ef;font-size:14px}
.hero h1{margin:14px 0 8px;font-size:clamp(30px,4.6vw,50px);line-height:1.1;letter-spacing:-.03em}
.hero p{margin:0 0 18px;color:var(--muted);font-size:clamp(15px,1.8vw,18px);font-weight:600;line-height:1.6}
.primary-btn,.secondary-btn{min-height:56px;border-radius:18px;padding:0 24px;font-size:18px;font-weight:900;box-shadow:inset 0 -5px 0 rgba(0,0,0,.10),0 10px 22px rgba(67,185,133,.23);transition:transform .14s ease,filter .14s ease}
.primary-btn{color:white;background:linear-gradient(145deg,#59ce98,#32aa75)}
.primary-btn.orange{background:linear-gradient(145deg,#ffad69,#f37742);box-shadow:inset 0 -5px 0 rgba(0,0,0,.1),0 10px 22px rgba(243,119,66,.22)}
.primary-btn.purple{background:linear-gradient(145deg,#c0a8ff,#9474ee);box-shadow:inset 0 -5px 0 rgba(0,0,0,.1),0 10px 22px rgba(148,116,238,.22)}
.secondary-btn{background:#fff;color:var(--ink);box-shadow:inset 0 -4px 0 rgba(39,51,79,.07),var(--soft)}
.primary-btn:active,.secondary-btn:active{transform:translateY(4px) scale(.985);filter:brightness(.97)}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap}

.mascot-scene{width:215px;height:215px;position:relative;z-index:2;justify-self:end}
.island{position:absolute;width:215px;height:70px;border-radius:50%;bottom:8px;left:2px;background:#82cc78;box-shadow:inset 0 -18px 0 #5ead63,0 18px 28px rgba(44,100,73,.19);transform:perspective(200px) rotateX(18deg)}
.sprout{position:absolute;width:126px;height:130px;left:45px;top:33px;border-radius:52% 48% 48% 52% / 56% 56% 44% 44%;background:linear-gradient(145deg,#ffdd75,#ffb94e);box-shadow:inset -12px -12px 0 rgba(239,139,51,.13),0 16px 25px rgba(177,119,45,.16);animation:mascotBob 3s ease-in-out infinite}
.sprout::before,.sprout::after{content:"";position:absolute;width:54px;height:34px;top:-21px;background:#53bf82}
.sprout::before{left:12px;border-radius:55px 12px 55px 12px;rotate:18deg}
.sprout::after{right:12px;border-radius:12px 55px 12px 55px;rotate:-18deg}
.eye{position:absolute;width:13px;height:18px;border-radius:50%;background:#3e3b43;top:54px}
.eye.e1{left:32px}.eye.e2{right:32px}
.eye::after{content:"";position:absolute;width:4px;height:5px;border-radius:50%;background:#fff;left:3px;top:2px}
.mouth{position:absolute;width:29px;height:16px;border-bottom:5px solid #d7665a;border-radius:0 0 30px 30px;left:49px;top:78px}
.cheek{position:absolute;width:19px;height:10px;border-radius:50%;background:rgba(241,106,102,.3);top:76px}
.cheek.c1{left:16px}.cheek.c2{right:16px}
.arm{position:absolute;width:52px;height:15px;border-radius:20px;background:#ffca58;top:87px}
.arm.a1{left:-33px;rotate:-26deg}.arm.a2{right:-31px;rotate:30deg}
.star-float{position:absolute;font-size:26px;animation:starWiggle 2.4s ease-in-out infinite alternate}
.star-float.s1{right:0;top:25px}.star-float.s2{left:7px;top:20px;animation-delay:-1s;font-size:20px}
@keyframes mascotBob{50%{translate:0 -8px;rotate:1deg}}
@keyframes starWiggle{to{transform:translateY(-8px) rotate(12deg) scale(1.1)}}

.pet-card{border-radius:30px;padding:22px;display:flex;flex-direction:column;gap:12px;min-height:265px}
.pet-stage{position:relative;height:165px;border-radius:24px;background:linear-gradient(180deg,#cfeaff 0 60%,#9ed47d 60% 100%);overflow:hidden;display:grid;place-items:center}
.pet-stage svg{width:115px;height:115px;filter:drop-shadow(0 14px 14px rgba(0,0,0,.15))}
.heart-bubble{position:absolute;width:22px;height:22px;background:#ff7d6c;border-radius:50% 50% 50% 0;transform:rotate(-45deg);animation:heartRise 1.8s ease-in infinite}
@keyframes heartRise{0%{opacity:0;translate:0 6px}20%{opacity:1}100%{opacity:0;translate:0 -64px}}
.pet-bar{height:9px;border-radius:9px;background:#e9eee9;overflow:hidden}
.pet-bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#59ca91,#ffcc59);transition:width .4s}
.pet-stats{display:flex;justify-content:space-between;font-size:13px;font-weight:800;color:var(--muted)}

.today-card{margin-top:18px;border-radius:28px;padding:22px;display:grid;grid-template-columns:1.4fr 1fr;gap:18px;align-items:center}
.today-card .words{display:flex;gap:11px;flex-wrap:wrap;margin-top:10px}
.today-tile{min-width:54px;height:54px;border-radius:17px;background:#fff4d7;display:grid;place-items:center;font-size:30px;font-family:"Kaiti SC","STKaiti","Songti SC",serif;font-weight:700;box-shadow:inset 0 -4px 0 rgba(190,137,31,.1);transition:transform .18s ease}
.today-tile.done{background:#ddf7e9;color:#1f7b53}
.today-tile.current{outline:3px solid var(--orange);outline-offset:2px;background:#fff}

.section-title{margin:24px 4px 12px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
.section-title h2{margin:0;font-size:clamp(22px,3vw,30px)}
.section-title p{margin:5px 0 0;color:var(--muted);font-weight:650;font-size:14px}
.world-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.world-card{min-height:175px;border-radius:25px;padding:18px;position:relative;overflow:hidden;box-shadow:var(--soft);text-align:left;transition:transform .16s ease,box-shadow .16s ease;border:3px solid transparent}
.world-card:active{transform:translateY(4px) scale(.985)}
.world-card.current{border-color:rgba(255,255,255,.85)}
.world-card.locked{filter:saturate(.55);opacity:.7}
.world-card .world-emoji{font-size:42px;display:block;margin-bottom:8px;filter:drop-shadow(0 6px 5px rgba(0,0,0,.09))}
.world-card h3{margin:0 0 3px;font-size:21px}
.world-card p{margin:0;font-size:13px;font-weight:700;color:rgba(39,51,79,.65)}
.world-progress{position:absolute;left:18px;right:18px;bottom:14px;height:8px;border-radius:8px;background:rgba(255,255,255,.55);overflow:hidden}
.world-progress i{display:block;height:100%;border-radius:8px;background:rgba(39,51,79,.58)}
.lock-badge{position:absolute;right:13px;top:13px;width:34px;height:34px;display:grid;place-items:center;border-radius:13px;background:rgba(255,255,255,.72)}

.game-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:10px}
.game-tile{min-height:115px;border-radius:21px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;transition:transform .16s ease,box-shadow .16s ease}
.game-tile:active{transform:translateY(3px)}
.game-tile svg{width:54px;height:54px}
.game-tile b{display:block;font-size:15px;margin-top:4px}
.game-tile small{display:block;color:var(--muted);margin-top:2px;font-weight:650;font-size:12px}

.lesson-screen{min-height:calc(100dvh - 30px);display:flex;flex-direction:column}
.lesson-topbar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;min-height:64px}
.lesson-progress{height:14px;border-radius:14px;background:rgba(255,255,255,.75);box-shadow:inset 0 2px 5px rgba(39,51,79,.08);overflow:hidden}
.lesson-progress i{display:block;height:100%;border-radius:14px;background:linear-gradient(90deg,#59ca91,#ffcc59);transition:width .4s cubic-bezier(.2,.8,.2,1)}
.step-count{min-width:74px;text-align:center;font-weight:850;color:var(--muted);font-size:14px}
.lesson-card{flex:1;border-radius:30px;margin-top:8px;min-height:0;padding:clamp(16px,2.6vw,30px);display:flex;flex-direction:column;align-items:stretch;justify-content:center;position:relative;overflow:visible}
.lesson-card>*{align-self:center}
.lesson-card::before{content:"";position:absolute;width:450px;height:450px;border-radius:50%;background:radial-gradient(circle,rgba(255,218,108,.13),rgba(255,218,108,0) 68%);top:-260px;left:-100px}
.step-kicker{color:var(--green-dark);font-weight:900;letter-spacing:.08em;font-size:13px;margin-bottom:6px;text-align:center}
.step-title{margin:0;font-size:clamp(24px,3.6vw,38px);text-align:center;line-height:1.15}
.step-hint{margin:7px auto 13px;color:var(--muted);text-align:center;font-size:clamp(14px,1.6vw,17px);font-weight:650;line-height:1.55;max-width:760px}
.lesson-actions{min-height:78px;padding-top:14px;display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}

.scene-wrap{position:relative;width:min(560px,100%);margin-top:6px}
.scene-svg{width:100%;height:auto;display:block;border-radius:28px;box-shadow:inset 0 -6px 0 rgba(39,51,79,.04),var(--soft);background:linear-gradient(180deg,#cfe9ff 0 60%,#9bd17c 60% 100%)}
.scene-svg.night{background:linear-gradient(180deg,#243468 0 60%,#445e6d 60% 100%)}
.scene-svg.sea{background:linear-gradient(180deg,#cfe9ff 0 35%,#5cc0ea 35% 100%)}
.scene-svg.dusk{background:linear-gradient(180deg,#ffd4a2 0 60%,#fcb078 60% 100%)}
.scene-svg.snow{background:linear-gradient(180deg,#dfeafc 0 60%,#f3f8ff 60% 100%)}
.scene-svg.forest{background:linear-gradient(180deg,#e6f1d8 0 60%,#9bd17c 60% 100%)}
.scene-svg.city{background:linear-gradient(180deg,#e3eaff 0 60%,#bcc8e4 60% 100%)}
.scene-svg.village{background:linear-gradient(180deg,#fff1c1 0 60%,#cfe089 60% 100%)}
.scene-svg.farm{background:linear-gradient(180deg,#fde2bd 0 60%,#f1b667 60% 100%)}
.scene-svg.desert{background:linear-gradient(180deg,#ffe5a5 0 60%,#f3c674 60% 100%)}
.hit{position:absolute;border-radius:50%;cursor:pointer;background:rgba(255,255,255,.001);transition:transform .12s ease}
.hit:active{transform:scale(.94)}
.hit-pop{position:absolute;font-size:30px;animation:popOut .9s ease forwards;pointer-events:none}
@keyframes popOut{0%{opacity:0;transform:scale(.4)}25%{opacity:1;transform:scale(1.15)}100%{opacity:0;transform:translateY(-30px) scale(.85)}}

.word-panel{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;background:#fff;border-radius:24px;padding:18px;box-shadow:var(--soft);margin-top:14px;width:min(560px,100%)}
.word-panel .big-char{font-family:"Kaiti SC","STKaiti","Songti SC",serif;font-size:clamp(110px,16vw,170px);line-height:.95;font-weight:700;color:#27334f;text-shadow:0 8px 0 rgba(39,51,79,.07)}
.pinyin{font-size:24px;color:var(--orange);font-weight:900;letter-spacing:.08em}
.word-meaning{color:var(--muted);font-size:15px;line-height:1.6;font-weight:650;margin-top:6px}
.speak-btn{margin-top:10px;min-width:135px;height:48px;border-radius:16px;background:#edf7ff;color:#367fbd;font-weight:900;box-shadow:inset 0 -4px 0 rgba(54,127,189,.08);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.speak-btn.speaking{animation:speakPulse .75s ease-in-out infinite alternate}
@keyframes speakPulse{to{transform:scale(1.06);background:#d7f1ff}}

.grid-2{width:min(740px,100%);display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:12px}
.grid-3{width:min(820px,100%);display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.choice-card{height:clamp(120px,17vh,165px);border-radius:25px;background:#fff;box-shadow:inset 0 -6px 0 rgba(39,51,79,.06),var(--soft);font-family:"Kaiti SC","STKaiti","Songti SC",serif;font-size:clamp(60px,9vw,100px);font-weight:700;transition:transform .16s ease,background .2s ease}
.choice-card:active{transform:translateY(4px)}
.choice-card.correct{background:#dbf7e8;animation:correctBounce .55s ease}
.choice-card.wrong{background:#ffe5e2;animation:wrongShake .42s ease}
.choice-card .pic{font-size:48px;display:block;margin-bottom:6px}
@keyframes correctBounce{50%{transform:scale(1.08) rotate(2deg)}}
@keyframes wrongShake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}

.board-assemble{width:min(720px,100%);display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:10px}
.slot{height:clamp(110px,16vh,160px);border-radius:24px;border:4px dashed #cad6e0;display:grid;place-items:center;font-size:48px;color:#aab6c7;background:rgba(255,255,255,.5)}
.slot.filled{border:0;background:#fff;color:inherit;box-shadow:inset 0 -5px 0 rgba(39,51,79,.05),var(--soft);font-family:"Kaiti SC","STKaiti","Songti SC",serif;font-weight:700}
.slot.armed{animation:slotReady .8s ease-in-out infinite}
@keyframes slotReady{50%{box-shadow:0 0 0 8px rgba(99,169,245,.18)}}

.piece-row{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:16px;min-height:80px}
.piece{min-width:84px;height:74px;border-radius:18px;background:#fff;box-shadow:inset 0 -5px 0 rgba(39,51,79,.06),var(--soft);font-family:"Kaiti SC","STKaiti","Songti SC",serif;font-size:42px;font-weight:700;display:grid;place-items:center;cursor:grab}
.piece:active{cursor:grabbing}
.piece.correct{background:#dbf7e8;pointer-events:none}
.piece.wrong{background:#ffe5e2;animation:wrongShake .42s ease}
.piece.fading{opacity:.25;pointer-events:none}

.trace-wrap{width:min(820px,100%);display:grid;grid-template-columns:minmax(280px,1fr) minmax(170px,.6fr);gap:20px;align-items:center;margin-top:6px}
.trace-board{width:100%;aspect-ratio:1/1;max-height:54vh;background:#fffdf7;border:5px solid #eadbbf;border-radius:30px;position:relative;overflow:hidden;box-shadow:inset 0 0 0 2px #fff,var(--soft);touch-action:none}
.trace-board::before,.trace-board::after{content:"";position:absolute;pointer-events:none;z-index:1}
.trace-board::before{left:50%;top:0;bottom:0;border-left:2px dashed rgba(185,151,105,.25)}
.trace-board::after{top:50%;left:0;right:0;border-top:2px dashed rgba(185,151,105,.25)}
.trace-guide{position:absolute;inset:0;display:grid;place-items:center;font-family:"Kaiti SC","STKaiti","Songti SC",serif;font-size:min(38vw,290px);color:rgba(39,51,79,.12);font-weight:700;pointer-events:none;z-index:2;line-height:1}
#traceCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:3;touch-action:none}
.trace-side{text-align:center}
.trace-side .model-char{font-family:"Kaiti SC","STKaiti","Songti SC",serif;font-size:108px;line-height:1}
.trace-side p{color:var(--muted);font-weight:650;line-height:1.55;font-size:14px}
.small-btn{min-height:44px;border-radius:15px;padding:0 14px;background:#edf1f6;font-weight:850;margin:4px;font-size:14px}

.play-stage{width:min(720px,100%);display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:6px}
.play-arena{position:relative;width:min(660px,100%);min-height:340px;height:auto;border-radius:28px;overflow:hidden;background:linear-gradient(180deg,#cbe9ff 0 64%,#9ed27d 64% 100%);box-shadow:inset 0 -6px 0 rgba(39,51,79,.05),var(--soft);display:block;margin:0 auto}
.play-arena svg.bg{position:absolute;inset:0;width:100%;height:100%;opacity:.95;border-radius:0}
.play-goal{position:absolute;font-size:54px;width:90px;height:90px;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:inset 0 -5px 0 rgba(39,51,79,.06),var(--soft);font-family:"Kaiti SC","STKaiti","Songti SC",serif;font-weight:700;color:var(--ink);left:50%;top:50%;translate:-50% -50%;font-size:58px}
.drop-target{position:absolute;border:3px dashed #ffd166;border-radius:18px;display:grid;place-items:center;color:#ffb23a;font-weight:900;font-size:18px}
.float-chip{position:absolute;font-size:42px;animation:floatUp 2s ease-in forwards;pointer-events:none}
@keyframes floatUp{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-60px)}}

.result-box{text-align:center;max-width:680px;position:relative;z-index:1}
.result-stars{font-size:clamp(44px,8vw,78px);letter-spacing:.06em;animation:starsEnter .8s cubic-bezier(.2,.9,.2,1.2)}
@keyframes starsEnter{from{transform:translateY(30px) scale(.5);opacity:0}}
.result-character{width:160px;height:160px;margin:12px auto;border-radius:45px;background:linear-gradient(145deg,#fff1bc,#ffd66b);display:grid;place-items:center;font-family:"Kaiti SC","STKaiti","Songti SC",serif;font-size:112px;font-weight:700;box-shadow:inset 0 -9px 0 rgba(192,130,28,.1),var(--shadow);animation:resultBob 2.2s ease-in-out infinite}

const wordsInWorld = id => WORDS.filter(w=>w.world===id);
const learnedCount = ()=>Object.keys(state.learned).length;
const dateString = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const todayString = ()=>dateString(new Date());

function cloneDefault(){return JSON.parse(JSON.stringify(DEFAULT_STATE))}
function loadState(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(!raw)return cloneDefault();
    const p=JSON.parse(raw);
    return {...cloneDefault(),...p,settings:{...DEFAULT_STATE.settings,...(p.settings||{})},pet:{...DEFAULT_STATE.pet,...(p.pet||{})},calendar:{...DEFAULT_STATE.calendar,...(p.calendar||{})},story:{...DEFAULT_STATE.story,...(p.story||{})}};
  }catch(e){return cloneDefault()}
}
function saveState(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(e){showToast("本地保存受限，请在设置中导出备份")}}
function shuffle(a){return[...a].sort(()=>Math.random()-.5)}
function randomOthers(word,n,pool=WORDS){return shuffle(pool.filter(w=>w.id!==word.id)).slice(0,n)}
function showToast(msg,ms=1700){const el=document.getElementById("toast");el.textContent=msg;el.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove("show"),ms)}
function confetti(n=34){const box=document.getElementById("confetti");box.innerHTML="";const cs=["#ffcc59","#43b985","#63a9f5","#f58caf","#ff8d55","#a687ef"];for(let i=0;i<n;i++){const p=document.createElement("i");p.style.left=(Math.random()*100)+"%";p.style.background=cs[i%cs.length];p.style.setProperty("--dx",((Math.random()-.5)*260)+"px");p.style.animationDelay=(Math.random()*.35)+"s";p.style.transform=`rotate(${Math.random()*180}deg)`;box.appendChild(p)}setTimeout(()=>box.innerHTML="",2300)}
function speak(text,onEnd){
  if(!state.settings.sound||!("speechSynthesis"in window)){if(onEnd)onEnd();return}
  try{speechSynthesis.cancel()}catch(e){}
  const u=new SpeechSynthesisUtterance(text);u.lang="zh-CN";u.rate=.78;u.pitch=1.12;
  const vs=speechSynthesis.getVoices();const zh=vs.find(v=>/^zh/i.test(v.lang))||null;
  if(zh)u.voice=zh;
  u.onend=()=>{if(onEnd)onEnd()};u.onerror=()=>{if(onEnd)onEnd()};
  speechSynthesis.speak(u);
}
function playTone(kind="ok"){
  if(!state.settings.sound)return;
  try{
    const Ctx=window.AudioContext||window.webkitAudioContext;const ctx=new Ctx();
    const ns=kind==="ok"?[523,659,784]:kind==="finish"?[523,659,784,1047]:[180,150];
    ns.forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type="sine";o.frequency.value=f;const t=ctx.currentTime+i*.1;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.11,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+.16);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+.18)});
    setTimeout(()=>ctx.close(),900);
  }catch(e){}
}
function updateStreak(){const today=todayString();if(state.lastStudyDate===today)return;const y=dateString(new Date(Date.now()-86400000));state.streak=state.lastStudyDate===y?state.streak+1:1;state.lastStudyDate=today}
function getNextWord(wid){const p=wordsInWorld(wid);return p.find(w=>!state.learned[w.id])||p[0]}
function isWorldUnlocked(i){if(i===0)return true;const prev=wordsInWorld(WORLDS[i-1].id);return prev.filter(w=>state.learned[w.id]).length>=3}
function petStage(){const xp=state.pet.xp;if(xp<20)return 0;if(xp<60)return 1;if(xp<120)return 2;return 3}
function cleanupView(){if(trace.ro)trace.ro.disconnect();trace={drawing:false,points:0,canvas:null,ctx:null,ro:null,word:null};try{speechSynthesis.cancel()}catch(e){}}
function nav(name,extra={}){cleanupView();view={...view,name,...extra};render();window.scrollTo(0,0)}

  if(css==="snow"){for(let i=0;i<20;i++){svg+=`<g transform="translate(${(i*73)%600} ${(i*37)%360})"><circle r="14" fill="#fff" opacity=".75"/><circle r="9" fill="#cfe5ff" opacity=".55"/></g>`}}

  defs.plants.forEach(([x,y,k])=>{
    if(k==="tree")svg+=`<g transform="translate(${x} ${y})"><rect x="-7" y="36" width="14" height="34" fill="#7a4e2a"/><circle r="38" cx="0" cy="14" fill="#3f9b51"/><circle r="22" cx="-18" cy="-2" fill="#5fb56e"/></g>`;
    else if(k==="bush")svg+=`<g transform="translate(${x} ${y})"><ellipse cx="0" cy="0" rx="36" ry="20" fill="#5fb56e"/></g>`;
    else if(k==="grass")svg+=`<g transform="translate(${x} ${y})"><path d="M-14 8 Q-7 -14 0 8 Q7 -14 14 8 Z" fill="#7fc079"/></g>`;
    else if(k==="snow")svg+=`<g transform="translate(${x} ${y})"><path d="M-25 0 q25 -30 50 0 z" fill="#fff" stroke="#cfe1f7"/></g>`;
  });
  defs.items.forEach(it=>{
    if(it.k==="sun")svg+=`<g class="sceneSun" transform="translate(${it.x} ${it.y})"><circle r="36" fill="#ffd76a"/><circle r="22" fill="#fff2a3"/>`+[0,45,90,135,180,225,270,315].map(a=>`<rect x="-2.4" y="-58" width="4.8" height="14" rx="2" fill="#ffd76a" transform="rotate(${a})"/>`).join("")+`</g>`;
    else if(it.k==="cloud"||it.k==="cloud2"){const c=it.k==="cloud"?"#fff":"#fef0d4";svg+=`<g transform="translate(${it.x} ${it.y})" class="sceneCloud"><ellipse rx="38" ry="20" fill="${c}"/><ellipse cx="-20" cy="-10" rx="22" ry="16" fill="${c}"/><ellipse cx="22" cy="-12" rx="26" ry="18" fill="${c}"/></g>`}

    else if(it.k==="star"||it.k==="star2"||it.k==="star3"){const col=it.k==="star"?"#ffd66b":it.k==="star2"?"#fff2a3":"#ffe28a";svg+=`<g transform="translate(${it.x} ${it.y})" class="sceneStar"><path d="M0 -18 L5 -5 L18 -5 L7 4 L11 18 L0 9 L-11 18 L-7 4 L-18 -5 L-5 -5 Z" fill="${col}"/></g>`}
    else if(it.k==="wave")svg+=`<g transform="translate(${it.x} ${it.y})"><path d="M-30 0 q15 -16 30 0 t30 0 t30 0" stroke="#fff" stroke-width="5" fill="none" opacity=".7"/></g>`;
    else if(it.k==="fish"||it.k==="fish2"){const c=it.k==="fish"?"#ff8a55":"#5cb1f5";svg+=`<g transform="translate(${it.x} ${it.y})" class="sceneFish"><path d="M0 0 q15 -12 30 0 q-15 12 -30 0 z" fill="${c}"/><path d="M30 0 l12 -8 l0 16 z" fill="${c}"/><circle cx="6" cy="-3" r="2" fill="#27334f"/></g>`}
    else if(it.k==="house"||it.k==="house2"){const w=it.k==="house"?"#ffe7c4":"#dfe6f5";svg+=`<g transform="translate(${it.x} ${it.y})"><rect x="-26" y="-30" width="52" height="44" fill="${w}"/><polygon points="-30,-30 0,-58 30,-30" fill="#ff8a55"/><rect x="-6" y="-12" width="12" height="26" fill="#5d6c84"/><rect x="-22" y="-26" width="14" height="14" fill="#fff8d9"/><rect x="8" y="-26" width="14" height="14" fill="#fff8d9"/></g>`}
    else if(it.k==="house3"||it.k==="house4"){const w=it.k==="house3"?"#ffe1c2":"#fde7e3";svg+=`<g transform="translate(${it.x} ${it.y})"><rect x="-32" y="-34" width="64" height="50" fill="${w}"/><polygon points="-36,-34 0,-66 36,-34" fill="#c46b3c"/><rect x="-8" y="-12" width="16" height="28" fill="#5d6c84"/><rect x="-26" y="-30" width="14" height="14" fill="#fff8d9"/></g>`}
    else if(it.k==="crop")svg+=`<g transform="translate(${it.x} ${it.y})"><path d="M-12 0 q12 -22 24 0 z" fill="#a3d968"/><circle cx="0" cy="-12" r="6" fill="#f6c54b"/></g>`;

}

function renderCalendar(){

/* =========================================================

const LESSON_STEPS=["看一看","认一认","拼一拼","描一描","玩一玩"];
function startLesson(wordId){
  const word=byId(wordId)||WORDS[0];updateStreak();state.currentWorld=word.world;saveState();
  nav("lesson",{wordId:word.id,world:word.world,step:0,score:0,mistakes:0,answered:false,completedRecorded:false,gameStage:0,gameScore:0,gameTargets:[]});
}
function renderLesson(){
  const word=byId(view.wordId);const step=view.step;
  app.innerHTML=`<div class="app-shell lesson-screen">
    <div class="lesson-topbar"><button class="icon-btn" id="lessonExit" aria-label="退出课程">×</button><div class="lesson-progress"><i style="width:${(step+1)/LESSON_STEPS.length*100}%"></i></div><div class="step-count">${step+1} / ${LESSON_STEPS.length}</div></div>

}
function lessonActionsMarkup(step){
  if(step===0)return `<button class="primary-btn" id="nextStep">我看到啦 →</button>`;
  if(step===2)return `<button class="secondary-btn" id="resetBuild">↻ 重置</button><span style="color:var(--muted);font-weight:750">把部件拖到正确的位置</span>`;
  if(step===3)return `<button class="primary-btn" id="traceDone" disabled style="opacity:.48">我描好啦 →</button>`;
  return `<span style="color:var(--muted);font-weight:750">完成上面的挑战就能继续</span>`;
}
function lessonStepMarkup(word,step){
  if(step===0){
    const {svg,items}=artScene(word.scene);
    return `<div class="step-kicker">第一步 · 看一看</div><h1 class="step-title">点一点画面，认识“${word.char}”</h1><p class="step-hint">点击图中的亮点，看看它们在做什么。</p>
    <div class="scene-wrap" id="sceneWrap">${svg}${items.map((it,i)=>{
      const emoji=itemEmoji(it.k);
      const baseX=Math.min(86,Math.max(6,it.x-7));
      const baseY=Math.min(72,Math.max(6,it.y-7));
      return `<button class="hit" data-hit="${i}" style="left:${baseX}%;top:${baseY}%;width:14%;height:14%"><span style="position:absolute;inset:0;display:grid;place-items:center;font-size:34px;animation:floatUp 2s ease-in-out infinite alternate">${emoji}</span></button>`;
    }).join("")}</div>
    <div class="word-panel"><div><div class="big-char">${word.char}</div><div class="pinyin">${word.pinyin}</div><div class="word-meaning">${word.meaning}</div></div><div style="text-align:right"><button class="speak-btn" id="speakWord">🔊 听一听</button></div></div>`;
  }
  if(step===1){
    const choices=shuffle([word,...randomOthers(word,3,wordsInWorld(word.world))]);
    return `<div class="step-kicker">第二步 · 认一认</div><h1 class="step-title">请找出“${word.char}”</h1><p class="step-hint">先听清楚字音，再点正确的汉字。</p>
    <div class="grid-2">${choices.map(w=>`<button class="choice-card" data-choice="${w.id}">${w.char}</button>`).join("")}</div>`;
  }
  if(step===2){
    const pieces=wordBuild(word);
    return `<div class="step-kicker">第三步 · 拼一拼</div><h1 class="step-title">把部件拼成“${word.char}”</h1><p class="step-hint">点一下部件，让它回到正确的位置。</p>
    <div class="board-assemble" id="board">${pieces.slotsLabels.map((s,i)=>`<div class="slot" data-slot="${i}"></div>`).join("")}</div>
    <div class="piece-row" id="pieces">${pieces.pool.map(p=>`<button class="piece" data-piece="${p.label}" data-target="${p.target}">${p.label}</button>`).join("")}</div>`;
  }
  if(step===3){
    return `<div class="step-kicker">第四步 · 描一描</div><h1 class="step-title">用手指描一描“${word.char}”</h1><p class="step-hint">沿着浅色汉字慢慢画，Apple Pencil 也可以。</p>
    <div class="trace-wrap"><div class="trace-board" id="traceBoard"><div class="trace-guide">${word.char}</div><canvas id="traceCanvas"></canvas></div>
    <div class="trace-side"><div class="model-char">${word.char}</div><p>画够几笔，就能完成<br>不怕画错，多多尝试！</p><button class="small-btn" id="clearTrace">↻ 重画</button><button class="small-btn" id="demoTrace">👀 看字形</button></div></div>`;
  }
  if(step===4){
    return `<div class="step-kicker">第五步 · 玩一玩</div><h1 class="step-title">为“${word.char}”挑一个游戏</h1><p class="step-hint">${word.game==="rocket"?"为字卡涂色，让火箭起飞。":word.game==="fish"?"钓到写着字的小鱼。":word.game==="fruits"?"把正确的字砸下来。":word.game==="water"?"用喷壶给汉字浇水。":word.game==="petal"?"一朵朵点出会读的字。":word.game==="puzzle"?"从四块里挑出正确的字。":"戳破写着字的气球。"}</p>
    <div id="playHost"></div>`;
  }
  return `<div class="result-box"><div class="result-stars">⭐ ⭐ ⭐</div><div class="result-character">${word.char}</div><h2>你认识“${word.char}”啦！</h2><p><b>${word.char} · ${word.pinyin}</b><br>${word.word} · ${word.phrase}<br>${word.meaning}</p></div>`;
}
function wordBuild(word){
  const safeParts=["一","丨","丿","乀","丶"];
  const labels=shuffle(safeParts).slice(0,3);
  const pool=shuffle([
    ...labels.map(label=>({label,target:word.char})),
    {label:"字",target:"字"},{label:"儿",target:"儿"},{label:"十",target:"十"}
  ]);
  return {slotsLabels:labels,pool};
}
function bindLessonStep(word,step){
  if(step===0){
    const speakIt=()=>{const b=$("#speakWord");b?.classList.add("speaking");speak(word.voiceWord,()=>b?.classList.remove("speaking"))};
    const items=artScene(word.scene).items;
    $("#sceneWrap").addEventListener("click",e=>{
      const btn=e.target.closest("[data-hit]");if(!btn)return;
      const idx=+btn.dataset.hit;const it=items[idx];
      const pop=document.createElement("div");pop.className="hit-pop";pop.textContent=itemEmoji(it.k);pop.style.left=btn.style.left;pop.style.top=btn.style.top;$("#sceneWrap").appendChild(pop);setTimeout(()=>pop.remove(),950);
      view.score=Math.min(5,view.score+1);playTone("ok");
    });
    $("#speakWord").addEventListener("click",speakIt);
    $("#nextStep").addEventListener("click",()=>nextLessonStep());
    if(state.settings.autoSpeak)setTimeout(speakIt,420);
  } else if(step===1){
    if(state.settings.autoSpeak)setTimeout(()=>speak(`请找出，${word.char}。${word.voiceWord}`),360);
    $$('[data-choice]').forEach(btn=>btn.addEventListener("click",()=>answerChoice(btn,btn.dataset.choice===word.id,word)));
  } else if(step===2){
    bindAssemble(word);
  } else if(step===3){
    initTrace();$("#clearTrace").addEventListener("click",clearTrace);$("#demoTrace").addEventListener("click",()=>{showToast(`看一看：${word.char}，${word.pinyin}，${word.word}`);speak(word.voiceWord)});
    $("#traceDone").addEventListener("click",()=>{if(trace.points>=18){view.score+=1;playTone("ok");nextLessonStep()}});
  } else if(step===4){
    bindPlayStage(word);
  }
}
function answerChoice(btn,correct,word){
  if(view.answered)return;
  if(correct){view.answered=true;btn.classList.add("correct");view.score+=1;playTone("ok");speak(`答对啦！${word.voiceWord}`);setTimeout(nextLessonStep,1100)}
  else{btn.classList.add("wrong");view.mistakes+=1;playTone("bad");speak("再看一看，再试一次。");setTimeout(()=>btn.classList.remove("wrong"),650)}
}
function nextLessonStep(){
  if(view.lessonBusy)return;
  view.lessonBusy=true;
  cleanupView();
  view.step+=1;view.answered=false;
  try{render()}catch(e){console.error(e)}
  setTimeout(()=>{view.lessonBusy=false},400);
}
function bindAssemble(word){
  const slots=$$("#board .slot");const pieces=$$("#pieces .piece");
  let armedSlot=0;
  const armSlot=()=>{slots.forEach((s,i)=>s.classList.toggle("armed",i===armedSlot&&!s.classList.contains("filled")))};
  armSlot();
  pieces.forEach(p=>{
    p.addEventListener("click",()=>{
      if(p.classList.contains("fading")||p.classList.contains("correct"))return;
      const slot=slots[armedSlot];
      if(!slot||slot.classList.contains("filled"))return;
      slot.textContent=p.textContent;slot.classList.add("filled");
      const isCorrect=p.dataset.target===word.char;
      p.dataset.wasCorrect=isCorrect?"1":"0";
      p.classList.add(isCorrect?"correct":"wrong");
      if(isCorrect){view.score+=1;playTone("ok")}else{view.mistakes+=1;playTone("bad")}
      setTimeout(()=>{p.classList.add("fading");p.classList.remove("wrong")},420);
      const filled=[...slots].filter(s=>s.classList.contains("filled")).length;
      if(filled===slots.length){
        const allRight=[...pieces].filter(x=>x.dataset.target===word.char).every(x=>x.dataset.wasCorrect==="1");
        if(!allRight){
          slots.forEach(s=>{s.classList.remove("filled");s.textContent=""});
          pieces.forEach(p=>p.classList.remove("correct","wrong","fading"));
          armedSlot=0; armSlot();
          speak(`再听一听，${word.voiceWord}`);
          return;
        }
        view.score+=1;playTone("ok");speak(`真棒！拼成了，${word.char}`);
        setTimeout(nextLessonStep,950);
      } else {
        while(armedSlot<slots.length&&slots[armedSlot].classList.contains("filled"))armedSlot++;
        if(armedSlot>=slots.length)armedSlot=0;
        armSlot();
      }
    });
  });
  $("#resetBuild").addEventListener("click",()=>{slots.forEach(s=>{s.classList.remove("filled");s.textContent=""}) ;pieces.forEach(p=>p.classList.remove("correct","wrong","fading"));armedSlot=0;armSlot()});
}

/* =========================================================
   TRACE
   ========================================================= */
function initTrace(){
  const canvas=$("#traceCanvas"),board=$("#traceBoard"),ctx=canvas.getContext("2d");trace.canvas=canvas;trace.ctx=ctx;
  const resize=()=>{const r=board.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2),old=trace.points;canvas.width=r.width*dpr;canvas.height=r.height*dpr;canvas.style.width=r.width+"px";canvas.style.height=r.height+"px";ctx.setTransform(dpr,0,0,dpr,0,0);ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#f17852";ctx.lineWidth=Math.max(16,r.width*.055);trace.points=old;};
  resize();trace.ro=new ResizeObserver(resize);trace.ro.observe(board);
  const point=e=>{const r=canvas.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top}};
  const start=e=>{e.preventDefault();trace.drawing=true;const p=point(e);ctx.beginPath();ctx.moveTo(p.x,p.y);trace.points++};
  const move=e=>{if(!trace.drawing)return;e.preventDefault();const p=point(e);ctx.lineTo(p.x,p.y);ctx.stroke();trace.points++;if(trace.points>18){const b=$("#traceDone");b.disabled=false;b.style.opacity="1"}};
  const end=e=>{if(trace.drawing){e.preventDefault();trace.drawing=false;ctx.closePath()}};
  canvas.addEventListener("pointerdown",start);canvas.addEventListener("pointermove",move);canvas.addEventListener("pointerup",end);canvas.addEventListener("pointercancel",end);canvas.addEventListener("pointerleave",end);
}
function clearTrace(){if(!trace.ctx)return;trace.ctx.clearRect(0,0,trace.canvas.width,trace.canvas.height);trace.points=0;const b=$("#traceDone");b.disabled=true;b.style.opacity=".48"}

function bindPlayStage(word){
  const host=$("#playHost");
  const lessonActions=$("#lessonActions");
  lessonActions.innerHTML=`<button class="secondary-btn" id="skipPlay">跳过</button><span style="color:var(--muted);font-weight:750">完成挑战再收获</span>`;

  switch(word.game){
    case"fruits":bindFruits(word);break;
    case"balloon":bindBalloon(word);break;
    case"petal":bindPetal(word);break;
    case"fish":bindFish(word);break;
    case"puzzle":bindPuzzle(word);break;
    case"water":bindWater(word);break;
    case"rocket":bindRocket(word);break;
    default:bindBalloon(word);
  }
}

function bindFruits(word){
  const host=$("#fruitHost");
  const pool=shuffle([word,...randomOthers(word,5,WORDS)]).slice(0,6);
  const placed=pool.map((w,i)=>({w,x:18+(i%3)*32,y:8+Math.floor(i/3)*38,alive:true}));
  const render=()=>{host.innerHTML=placed.map((p,i)=>p.alive?`<button class="choice-card" data-fruit="${i}" style="position:absolute;left:${p.x}%;top:${p.y}%;width:24%;height:34%;font-size:clamp(36px,5vw,52px);border-radius:24px;background:radial-gradient(circle at 50% 30%,#fff7d6,#ffd66b)">${p.w.char}</button>`:"").join("")};

function bindBalloon(word){

/* =========================================================
   COMPLETE WORD
   ========================================================= */
function completeWord(word){
  if(view.completedRecorded)return;
  view.completedRecorded=true;
  const old=state.learned[word.id]||{mastery:0,times:0};
  const gained=Math.max(1,3-Math.min(2,view.mistakes));
  state.learned[word.id]={mastery:Math.min(100,old.mastery+35+view.score*8),times:old.times+1,last:Date.now()};
  state.attempts[word.id]=(state.attempts[word.id]||0)+1;
  state.stars+=gained;state.totalSessions+=1;
  state.pet.xp+=gained*2;state.pet.mood=Math.min(100,state.pet.mood+2);
  state.due=[...new Set([...(state.due||[]),word.id])].slice(-12);
  const todayDone=DAILY_PLAN.every(id=>!!state.learned[id]);
  if(todayDone)markDailyDone();
  saveState();playTone("finish");confetti();
  setTimeout(()=>speak(`太棒啦！你认识了，${word.char}。得到${gained}颗星星！`),250);
  app.innerHTML=`<div class="app-shell lesson-screen"><section class="lesson-card"><div class="result-box"><div class="result-stars">⭐ ⭐ ⭐</div><div class="result-character">${word.char}</div><h2>你认识“${word.char}”啦！</h2><p><b>${word.char} · ${word.pinyin}</b><br>${word.word} · ${word.phrase}<br>${word.meaning}</p><div class="hero-actions" style="justify-content:center;margin-top:14px"><button class="secondary-btn" data-back-home>回到小岛</button><button class="primary-btn orange" data-next-word>继续下一个 →</button></div></div></section></div>`;
  $("[data-back-home]").addEventListener("click",()=>nav("home"));
  $("[data-next-word]").addEventListener("click",()=>{const pool=wordsInWorld(word.world),idx=pool.findIndex(w=>w.id===word.id);const next=pool[(idx+1)%pool.length];startLesson(next.id)});
}

function startGame(type){
  if(["balloon","petal","fish","puzzle","fruits","water","rocket","story"].includes(type)){nav("game",{game:{type,round:0,score:0}});return}
  if(learnedCount()<2){showToast("先认识至少 2 个汉字，就能打开复习乐园啦");return}
  nav("game",{game:{type,round:0,score:0,pool:WORDS.filter(w=>state.learned[w.id])}});
}
function renderGame(){

function renderGamePlay(){

function buildStory(){
  const learned=WORDS.filter(w=>state.learned[w.id]);
  if(learned.length<3)return null;
  const picks=learned.slice(0,Math.min(6,learned.length));
  const pages=[
    {art:"sun",text:`<u data-spell="${picks[0].id}">${picks[0].char}</u> 出来啦。`}
  ];
  if(picks[1])pages.push({art:"water",text:`<u data-spell="${picks[1].id}">${picks[1].char}</u> 闪亮亮。`});
  if(picks[2])pages.push({art:"tree",text:`<u data-spell="${picks[0].id}">${picks[0].char}</u> 在 <u data-spell="${picks[2].id}">${picks[2].char}</u> 里。`});
  if(picks[3])pages.push({art:"forest",text:`<u data-spell="${picks[3].id}">${picks[3].char}</u> 看见了 <u data-spell="${picks[1]?picks[1].id:picks[0].id}">${picks[1]?picks[1].char:picks[0].char}</u>。`});
  if(picks[4])pages.push({art:"city",text:`<u data-spell="${picks[4].id}">${picks[4].char}</u> 走来了。`});
  pages.push({art:"home",text:`大家都 ${picks[0].char} 开心。`});
  return pages;
}
function renderStory(){
  const pages=buildStory();
  if(!pages){showToast("先认识至少 3 个字再读绘本哦");nav("home");return}
  const idx=Math.min(state.story.read||0,pages.length-1);
  app.innerHTML=`<div class="app-shell"><header class="topbar"><div class="brand"><span class="brand-mark">🌱</span><span>字芽岛<small>V2 · 互动版</small></span></div><div class="top-actions"><button class="icon-btn" data-nav="home" aria-label="返回">←</button></div></header><div class="story-book paper" style="display:block"><div class="story-page"><div class="story-art">${sceneBgSvg(pages[idx].art)}</div><div class="story-text" id="storyText">${pages[idx].text}</div></div><div class="story-pager"><button class="secondary-btn" id="storyPrev">← 上一页</button><div class="page-dots">${pages.map((_,i)=>`<i class="${i===idx?"on":""}"></i>`).join("")}</div><button class="secondary-btn" id="storyNext">下一页 →</button></div></div></div>`;
  let cur=idx;
  const go=p=>{cur=Math.max(0,Math.min(pages.length-1,p));state.story.read=cur;saveState();render()};

}
function exportData(){const payload={app:"字芽岛 V2",version:2,exportedAt:new Date().toISOString(),state};const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=`字芽岛V2-${todayString()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),500);showToast("备份文件已导出")}
function importData(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const p=JSON.parse(reader.result);if(!p.state||p.version!==2)throw new Error();state={...cloneDefault(),...p.state,settings:{...DEFAULT_STATE.settings,...(p.state.settings||{})},pet:{...DEFAULT_STATE.pet,...(p.state.pet||{})},calendar:{...DEFAULT_STATE.calendar,...(p.state.calendar||{})},story:{...DEFAULT_STATE.story,...(p.story||{})}};saveState();showToast("学习进度已恢复");setTimeout(()=>nav("home"),700)}catch(err){showToast("这个备份文件无法读取")}};reader.readAsText(file)}
function resetData(){if(confirm("确定要清空全部学习进度吗？")){state=cloneDefault();saveState();showToast("已经重新开始");setTimeout(()=>nav("home"),500)}}

function bindCommon(){$$('[data-nav]').forEach(btn=>btn.addEventListener('click',()=>nav(btn.dataset.nav)));$$('[data-start]').forEach(btn=>btn.addEventListener('click',()=>startLesson(btn.dataset.start)))}
function render(){
  document.body.classList.toggle("large-text",!!state.settings.largeText);
  if(view.name==="home")renderHome();
  else if(view.name==="lesson")renderLesson();
  else if(view.name==="library")renderLibrary();
  else if(view.name==="settings")renderSettings();
  else if(view.name==="report")renderReport();
  else if(view.name==="calendar")renderHome();
  else if(view.name==="game"){
    const g=view.game;
    if(!g)return renderHome();
    if(g.round>=5&&!["balloon","petal","fish","puzzle","fruits","water","rocket"].includes(g.type))return renderGameResult();
    renderGame();
  }
  else renderHome();
}

window.addEventListener("beforeunload",saveState);
document.addEventListener("visibilitychange",()=>{if(document.hidden)saveState()});
window.addEventListener("load",()=>{
  if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("./sw.js").catch(()=>{});
  render();
});
</script>
